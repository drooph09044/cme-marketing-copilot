version: 1

databricks:
  allow_uc_filestyle_io: true
  catalog: cmegtmdev
  schemas:
    sources: marketing_sources
    cdp: marketing_cdp
    copilot: marketing_copilot
    audit: marketing_audit
  volumes:
    root: /Volumes/cmegtmdev/marketing_sources/volumes
    output_root: /Volumes/cmegtmdev/marketing_sources/volumes
  warehouse:
    env: DATABRICKS_WAREHOUSE_ID
    id: 447e5ede90a60526
  limits:
    table_read_row_limit_env: CODEX_TABLE_READ_ROW_LIMIT
    sql_timeout_seconds_env: CODEX_SQL_TIMEOUT_SECONDS
    uc_sql_cache_seconds_env: CODEX_UC_SQL_CACHE_SECONDS
    uc_volume_cache_seconds_env: CODEX_UC_VOLUME_CACHE_SECONDS
  table_overrides:
    app_events: [cdp, app_events]
    med_app_events: [sources, med_app_events]

sources:
  default: media
  supported:
    media:
      label: Media & OTT
      prefixes: [med]
      aliases: [media]
    sports:
      label: Sports
      prefixes: [spt]
      aliases: [sports]
    automotive:
      label: Automotive
      prefixes: [aut, auto]
      aliases: [automotive, automotice]
    telecom:
      label: Telecom
      prefixes: [tel]
      aliases: [telecom]

