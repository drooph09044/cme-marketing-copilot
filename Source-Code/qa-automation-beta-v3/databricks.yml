# This is a Declarative Automation Bundle definition for qa-automation.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: qa-automation

variables:
  databricks_host:
    description: Databricks workspace URL supplied at deployment time

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host}

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: ${var.databricks_host}
