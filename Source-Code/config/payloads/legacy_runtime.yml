    "PIPELINE_STEPS": [
      {
        "id": "step1",
        "name": "Semantic Tagging",
        "script": "step1_semantic_tagging.py",
        "outputs": [
          "tag_mappings.json"
        ]
      },
      {
        "id": "step2",
        "name": "Preprocessing",
        "script": "step2_preprocess.py",
        "outputs": [
          "preprocessed_data/all_preprocessed"
        ]
      },
      {
        "id": "step2b",
        "name": "Standardization",
        "script": "step2b_standardize.py",
        "outputs": [
          "standardized_data/all_standardized"
        ]
      },
      {
        "id": "step3",
        "name": "Blocking & Matching",
        "script": "step3_blocking.py",
        "outputs": [
          "candidate_pairs"
        ]
      },
      {
        "id": "step4",
        "name": "Clustering",
        "script": "step4_clustering.py",
        "outputs": [
          "clustered_records",
          "cluster_summary.json"
        ]
      },
      {
        "id": "step5",
        "name": "Golden Record",
        "script": "step5_golden_record.py",
        "outputs": [
          "golden_records",
          "superseded_ids",
          "golden_record_summary.json"
        ]
      },
      {
        "id": "step6",
        "name": "Evaluation",
        "script": "step6_evaluation.py",
        "outputs": [
          "evaluation_report.json"
        ]
      }
    ],
    "_ENRICHMENT_OVERRIDES": {
      "2p_fan_scores": {
        "party": "ML",
        "source_type": "ML Scoring",
        "owner": "Internal ML",
        "use_for_identity": false,
        "use_for_enrichment": true,
        "description": "Fan engagement scores — internal ML model",
        "match_key": "email"
      },
      "3p_ltv_propensity": {
        "party": "ML",
        "source_type": "ML Scoring",
        "owner": "Internal ML",
        "use_for_identity": false,
        "use_for_enrichment": true,
        "description": "LTV and propensity scores — internal ML model",
        "match_key": "golden_id_ref"
      },
      "2p_location_data": {
        "party": "3P",
        "source_type": "Enrichment",
        "owner": "GeoSignal",
        "use_for_identity": false,
        "use_for_enrichment": true,
        "description": "Venue visit and location signals from GeoSignal",
        "match_key": "device_id"
      },
      "3p_demographics": {
        "party": "3P",
        "source_type": "Enrichment",
        "owner": "DataBridge",
        "use_for_identity": false,
        "use_for_enrichment": true,
        "description": "Demographic attributes from DataBridge",
        "match_key": "zip+phone_prefix"
      }
    },
